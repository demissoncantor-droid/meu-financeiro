<style>
/* Layout: app de uma coluna (máx. 520px), cabeçalho simples, conteúdo em cartões, barra de navegação fixa embaixo com 5 áreas. */
:root{
  --bg:#edf2ef; --surface:#ffffff; --surface2:#e3ebe7; --ink:#10231f; --muted:#5a6e68; --line:#d6e0db;
  --brand:#0e6b5c; --on-brand:#ffffff; --in:#0d7a57; --out:#cc4627; --warn:#b4701a;
  --hero1:#0a3a33; --hero2:#10705f; --shadow:0 1px 2px rgba(16,35,31,.06),0 10px 28px rgba(16,35,31,.07);
  --on-accent:#fff; --in-bg:#dff3ea; --out-bg:#fbe5de; --brand-bg:#d9eee8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09130f; --surface:#122019; --surface2:#1a2c25; --ink:#e8f2ee; --muted:#8fa79f; --line:#233830;
  --brand:#3ecf9f; --on-brand:#05261c; --in:#4fd6a0; --out:#ff8f70; --warn:#e7b25a;
  --hero1:#0b3d35; --hero2:#12705f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
  --on-accent:#05261c; --in-bg:#12352a; --out-bg:#3a1f17; --brand-bg:#12352c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09130f; --surface:#122019; --surface2:#1a2c25; --ink:#e8f2ee; --muted:#8fa79f; --line:#233830;
  --brand:#3ecf9f; --on-brand:#05261c; --in:#4fd6a0; --out:#ff8f70; --warn:#e7b25a;
  --hero1:#0b3d35; --hero2:#12705f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
  --on-accent:#05261c; --in-bg:#12352a; --out-bg:#3a1f17; --brand-bg:#12352c; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;margin:0 auto;padding:18px 0 130px;min-height:100vh}
.num{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px;min-height:44px}
.top h1{margin:0;font-size:1.55rem;line-height:1.15;letter-spacing:-.02em;flex:1;min-width:0;text-wrap:balance}
.top small{display:block;color:var(--muted);font-size:.82rem;font-weight:500;margin-bottom:2px}
.top small::first-letter{text-transform:uppercase}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:-8px 4px -2px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3,.sec{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 0}
.lbl{font-size:.84rem;color:var(--muted);font-weight:600}
.hero{border-radius:26px;padding:22px 20px;color:#fff;background:linear-gradient(150deg,var(--hero1),var(--hero2));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{color:rgba(255,255,255,.75)}
.hero .big{display:block;font-size:clamp(2rem,9.5vw,2.7rem);font-weight:750;letter-spacing:-.03em;margin:6px 0 4px;line-height:1.1}
.hero p{margin:0;color:rgba(255,255,255,.72);font-size:.86rem}
.neg{color:var(--out)}.hero .neg{color:#ffb4a0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:1rem;width:100%}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.in{background:var(--in);color:var(--on-accent);border-color:transparent}
.btn.out{background:var(--out);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--out);border-color:var(--out);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:44px;font-size:.92rem;border-radius:13px}
.btn:active,.row:active,.tile:active,.ccard:active,.nav button:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile strong{font-size:1.2rem;letter-spacing:-.02em}
.tile .lbl{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:14px 0 12px;gap:2px}
.stackbar i{display:block;min-width:0}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.92rem}
.legend b{margin-left:auto;font-weight:650}
.free{font-size:2rem;font-weight:750;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:0;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);min-height:64px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.ico.in{background:var(--in-bg);color:var(--in)}.ico.out{background:var(--out-bg);color:var(--out)}.ico.brand{background:var(--brand-bg);color:var(--brand)}
.rv.in{color:var(--in)}.rv.out{color:var(--out)}
.empty{text-align:center;color:var(--muted);padding:26px 18px;background:var(--surface);border-radius:20px;border:1.5px dashed var(--line);font-size:.94rem}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:0 14px;min-height:40px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip.add{border-style:dashed;color:var(--brand)}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.bar-r{display:grid;gap:6px}
.bar-r div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.bar-r div:first-child span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--out)}
.ccard{display:flex;flex-direction:column;gap:14px;width:100%;text-align:left;border:0;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:var(--shadow);position:relative;overflow:hidden}
.ccard::after{content:"";position:absolute;right:-50px;bottom:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.ccard .c-top,.ccard .c-bot{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;opacity:.9}
.ccard .c-top b{font-size:1.08rem;opacity:1}
.ccard small{opacity:.75;font-size:.8rem;display:block}
.ccard strong{font-size:1.9rem;letter-spacing:-.03em;font-weight:750}
.ccard .track{background:rgba(255,255,255,.22);height:8px}.ccard .track i{background:#fff}
.mt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mt div{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.mt strong{display:block;font-size:.9rem;white-space:nowrap;margin-top:2px;overflow-wrap:anywhere}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-height:84px}
.menu .ico{width:52px;height:52px;border-radius:17px}
.menu b{display:block;font-size:1.06rem}.menu small{color:var(--muted)}
.menu>span:nth-child(2){flex:1;min-width:0}
.kid{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.kid>button.main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;text-align:left;padding:0;min-height:56px}
.avatar{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#fff;flex:none}
.kid b{display:block}.kid strong{font-size:1.15rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;border-radius:16px;font-size:.72rem;font-weight:650;color:var(--muted);justify-content:center}
.nav button.on{color:var(--brand);background:var(--brand-bg)}
.nav svg.i{width:24px;height:24px}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,15,12,.55);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:1.3rem;letter-spacing:-.02em}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet-note{margin:0;color:var(--muted);font-size:.94rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.84rem;font-weight:650;color:var(--muted)}
.field input,.field select,.money{width:100%;min-height:54px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:1.05rem;outline:none}
.field input:focus,.field select:focus,.money:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.money{display:flex;align-items:center;gap:8px}.money span{color:var(--muted);font-weight:700}
.money input{border:0;background:none;box-shadow:none!important;padding:0;min-height:50px;flex:1;min-width:0;font-weight:700;font-size:1.25rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{border:0;background:none;min-height:46px;border-radius:12px;font-weight:650;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.err{margin:0;color:var(--out);font-weight:600;font-size:.92rem;min-height:0}.err:empty{display:none}
.sheet-actions{display:flex;flex-direction:column;gap:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.login h1{margin:0;font-size:1.7rem;letter-spacing:-.02em;line-height:1.15}.login p{margin:0;color:var(--muted)}.login p b{color:var(--ink)}
.login .logo{border-radius:20px;box-shadow:var(--shadow)}
.login input{letter-spacing:.2em;font-weight:700;font-size:1.4rem;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const R=v=>brl.format(v||0);
const r2=n=>Math.round(n*100)/100;
const sum=a=>r2(a.reduce((t,x)=>t+x,0));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fdate=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')}catch(e){return ''}};
function parseMoney(s){s=String(s).trim().replace(/R\$|\s/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');return r2(Number(s))}
const inputMoney=v=>v===''||v==null?'':String(v).replace('.',',');

/* ---------- ícones ---------- */
const P={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 down:'<path d="M12 4v14M6 12l6 6 6-6"/>',up:'<path d="M12 20V6M6 12l6-6 6 6"/>',
 card:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/>',
 more:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 kids:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5v.5M15 9.5v.5"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',
 bag:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- dados ---------- */
const KEY='meu-controle-financeiro-v1';
const mk=o=>({id:uid(),ts:Date.now(),...o});
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
const defaults=()=>({
 entradas:[],saidas:[],cartoes:[],reserva:[],filhos:[],
 cats:['Alimentação','Água','Energia','Internet','Combustível','Aluguel'].map((nome,i)=>({id:'cat-'+slug(nome),ts:i+1,nome})),
 objetivos:['Alimentação','Contas básicas','Reserva de emergência','Filhos','Lazer'].map((nome,i)=>({id:'obj-'+slug(nome),ts:i+1,nome,valor:0}))
});
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=Object.assign(defaults(),S||{});
let canSave=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}syncPush()}

/* ---------- sincronização (db compartilhado) ---------- */
const COLS=['entradas','saidas','cats','cartoes','reserva','filhos','objetivos'];
const ser=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,y)=>(a[y]=x[y],a),{}):x);
const clone=o=>JSON.parse(JSON.stringify(o));
let DB=null,synced=false,syncState='local',shadow={},chain={},stash={},got=new Set(),metaExists=null,rq=0;
COLS.forEach(c=>shadow[c]={});
function setSync(st){syncState=st;if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function lazyRender(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function writeDoc(c,rec,json){
 const k=c+'/'+rec.id;
 chain[k]=(chain[k]||Promise.resolve()).then(()=>DB.collection(c).doc(rec.id).set(JSON.parse(json))).catch(e=>{delete shadow[c][rec.id];setSync(e&&e.code==='invalid_argument'?'readonly':'error')});
}
function syncPush(){
 if(!DB||!synced)return;
 for(const c of COLS){
  const ids=new Set();
  for(const rec of S[c]){ids.add(rec.id);const j=ser(rec);if(shadow[c][rec.id]!==j){shadow[c][rec.id]=j;writeDoc(c,rec,j)}}
  for(const id of Object.keys(shadow[c]))if(!ids.has(id)){delete shadow[c][id];const k=c+'/'+id;chain[k]=(chain[k]||Promise.resolve()).then(()=>DB.collection(c).doc(id).delete()).catch(e=>setSync(e&&e.code==='invalid_argument'?'readonly':'error'))}
 }
}
function reconcile(c,docs){
 const list=S[c],map=new Map(list.map(x=>[x.id,x])),seen=new Set();
 for(const d of docs){
  seen.add(d.id);const data=Object.assign({},d.data(),{id:d.id}),j=ser(data);shadow[c][d.id]=j;
  const o=map.get(d.id);
  if(o){if(ser(o)!==j){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,clone(data))}}else list.push(clone(data));
 }
 for(let i=list.length-1;i>=0;i--)if(!seen.has(list[i].id)&&shadow[c][list[i].id]!==undefined){delete shadow[c][list[i].id];list.splice(i,1)}
 for(const id of Object.keys(shadow[c]))if(!seen.has(id))delete shadow[c][id];
 list.sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function tryStart(){
 if(synced||metaExists===null||got.size<COLS.length)return;
 if(!metaExists){
  try{const has=COLS.some(c=>S[c].length);if(has&&canSave)localStorage.setItem(KEY+'-backup',JSON.stringify(S))}catch(e){}
  synced=true;
  DB.collection('meta').doc('init').set({criado:Date.now()}).catch(()=>setSync('readonly'));
  syncPush();
 }else{
  try{if(COLS.some(c=>S[c].length))localStorage.setItem(KEY+'-backup',JSON.stringify(S))}catch(e){}
  synced=true;COLS.forEach(c=>reconcile(c,stash[c]));
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  syncPush(); // envia ao Supabase registros locais que ainda não existem na nuvem
 }
 setSync('ok');
}
const CODE_KEY='mcf-codigo';
const getCode=()=>{try{return localStorage.getItem(CODE_KEY)}catch(e){return null}};
const cfgOk=()=>!!window.APP_CONFIG&&!/^COLE/.test(window.APP_CONFIG.supabaseUrl||'')&&!/^COLE/.test(window.APP_CONFIG.supabaseKey||'');
function connectSupabase(code){
 const cfg=window.APP_CONFIG,base=cfg.supabaseUrl.replace(/\/+$/,'')+'/rest/v1/rpc/';
 const hdr={'apikey':cfg.supabaseKey,'Content-Type':'application/json'};
 const rpc=async(fn,body)=>{
  let r;try{r=await fetch(base+fn,{method:'POST',headers:hdr,body:JSON.stringify(body)})}catch(e){throw{code:'unavailable',message:String(e)}}
  const t=await r.text();if(!r.ok)throw{code:'unavailable',message:t};return t?JSON.parse(t):null};
 let pending=0,epoch=0,started=false;const ls=[],last={};
 const write=async(fn,body)=>{pending++;epoch++;try{return await rpc(fn,body)}finally{pending--;epoch++}};
 async function poll(){
  if(pending||document.hidden)return;const e0=epoch;let rows;
  try{rows=await rpc('listar_registros',{p_familia:code})}catch(e){ls.forEach(l=>l.err&&l.err(e));return}
  if(pending||epoch!==e0)return;
  const by={};rows.forEach(r=>(by[r.colecao]=by[r.colecao]||[]).push(r));
  for(const l of ls){
   const list=(by[l.col]||[]).filter(r=>!l.id||r.id===l.id),k=l.col+'/'+(l.id||''),j=ser(list.map(r=>[r.id,r.dados]));
   if(last[k]===j&&l.seen)continue;last[k]=j;l.seen=true;
   l.cb(l.id?{exists:list.length>0,metadata:{fromCache:false}}:{docs:list.map(r=>({id:r.id,data:()=>r.dados})),metadata:{fromCache:false}});
  }
 }
 const start=()=>{if(started)return;started=true;setTimeout(poll,0);setInterval(poll,6000);
  document.addEventListener('visibilitychange',poll);addEventListener('online',poll);addEventListener('focus',poll)};
 const sub=(col,id)=>(cb,err)=>{ls.push({col,id,cb,err});start()};
 return {collection:c=>({
  onSnapshot:sub(c,null),
  doc:id=>({
   onSnapshot:sub(c,id),
   set:d=>write('salvar_registro',{p_familia:code,p_colecao:c,p_id:id,p_dados:d}),
   delete:()=>write('apagar_registro',{p_familia:code,p_colecao:c,p_id:id})
  })})};
}
function showLogin(msg){
 const w=$('#login');w.hidden=false;document.body.classList.add('lock');
 w.innerHTML=`<form class="login" novalidate><img src="icon.svg" width="76" height="76" alt="" class="logo"><h1>Meu Controle Financeiro</h1><p>Digite o <b>código da família</b>. Use o mesmo código no celular da sua esposa para os dois verem os mesmos dados.</p><label class="field"><span>Código (4 a 12 números)</span><input id="codigo" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Ex.: 48291375"></label><p class="err" id="lerr" role="alert">${esc(msg||'')}</p><button class="btn primary" type="submit">Entrar</button><p class="lbl" style="text-align:center;margin:0">Use o mesmo código em todos os aparelhos. Na primeira vez, ele cria o espaço da família.</p></form>`;
 const f=w.querySelector('form');
 f.onsubmit=e=>{e.preventDefault();const c=f.querySelector('#codigo').value.trim();
  if(!/^\d{4,12}$/.test(c)){w.querySelector('#lerr').textContent='Digite de 4 a 12 números.';return}
  try{localStorage.setItem(CODE_KEY,c)}catch(x){}
  w.hidden=true;w.innerHTML='';document.body.classList.remove('lock');initSync()};
}
async function initSync(){
 let db=null;
 if(cfgOk()){
  const code=getCode();
  if(!code||code==='local'){showLogin();return}
  setSync('connecting');
  try{db=connectSupabase(code)}catch(e){setSync('error');return}
 }else{
  setSync('error');
  return;
 }
 if(!db)return;
 DB=db;setSync('connecting');
 const fail=()=>{if(!synced)setSync('offline')};
 const t=setTimeout(fail,10000);
 try{
  db.collection('meta').doc('init').onSnapshot(sn=>{if(sn.metadata.fromCache&&!sn.exists)return;metaExists=sn.exists;clearTimeout(t);tryStart()},fail);
  COLS.forEach(c=>db.collection(c).onSnapshot(sn=>{
   if(synced){reconcile(c,sn.docs);lazyRender();return}
   stash[c]=sn.docs;if(!sn.metadata.fromCache)got.add(c);tryStart();
  },fail));
 }catch(e){fail()}
}

const TIPOS={salario:'Salário',extra:'Renda extra',outra:'Outra entrada'};
const mv=m=>m.tipo==='add'?m.valor:-m.valor;
const movTotal=(l,skip)=>sum(l.filter(m=>m.id!==skip).map(mv));
function totals(){
 const ent=sum(S.entradas.map(e=>e.valor)),sai=sum(S.saidas.map(e=>e.valor));
 const res=movTotal(S.reserva),fil=sum(S.filhos.map(f=>movTotal(f.movs)));
 const saldo=r2(ent-sai);
 return {ent,sai,res,fil,saldo,livre:r2(saldo-res-fil)};
}

function fieldHtml(f){
 const id='f_'+f.id;let inp;
 if(f.type==='seg')inp=`<div class="seg" id="${id}" role="radiogroup">${f.options.map(o=>`<button type="button" role="radio" data-v="${o[0]}" class="${o[0]===f.value?'on':''}">${esc(o[1])}</button>`).join('')}</div>`;
 else if(f.type==='select')inp=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 else if(f.type==='money')inp=`<div class="money"><span>R$</span><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(inputMoney(f.value))}"></div>`;
 else if(f.type==='date')inp=`<input id="${id}" type="date" value="${esc(f.value)}">`;
 else if(f.type==='day')inp=`<input id="${id}" type="number" inputmode="numeric" min="1" max="31" placeholder="Ex.: 10" value="${esc(f.value)}">`;
 else inp=`<input id="${id}" type="text" autocomplete="off" placeholder="${esc(f.placeholder||'')}" value="${esc(f.value)}">`;
 return `<${f.type==='seg'?'div':'label for="'+id+'"'} class="field"><span>${esc(f.label)}</span>${inp}</${f.type==='seg'?'div':'label'}>`;
}
function closeSheet(){const w=$('#sheet');w.hidden=true;w.innerHTML='';document.body.classList.remove('lock')}
function openSheet(c){
 const w=$('#sheet');
 w.innerHTML=`<div class="scrim" data-close></div><form class="sheet" novalidate><div class="grab"></div><h2>${esc(c.title)}</h2>${c.text?`<p class="sheet-note">${esc(c.text)}</p>`:''}${(c.fields||[]).map(fieldHtml).join('')}<p class="err" id="err" role="alert"></p><div class="sheet-actions"><button class="btn ${c.tone||'primary'}" type="submit">${esc(c.save||'Salvar')}</button>${c.onDelete?'<button class="btn danger" type="button" data-del>Excluir</button>':''}<button class="btn ghost" type="button" data-close>Cancelar</button></div></form>`;
 w.hidden=false;document.body.classList.add('lock');
 const form=w.querySelector('form'),err=w.querySelector('#err');
 w.onclick=e=>{
  if(e.target.closest('[data-close]'))return closeSheet();
  const sb=e.target.closest('.seg button');
  if(sb){sb.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb))}
  const d=e.target.closest('[data-del]');
  if(d){if(!d.dataset.sure){d.dataset.sure=1;d.textContent='Toque de novo para confirmar';return}
   c.onDelete();save();closeSheet();render()}
 };
 form.onsubmit=e=>{
  e.preventDefault();const v={};
  for(const f of c.fields||[]){
   const el=form.querySelector('#f_'+f.id);let x;
   if(f.type==='seg')x=el.querySelector('.on').dataset.v;
   else if(f.type==='money'){x=parseMoney(el.value);
    if(isNaN(x)){if(f.opt)x=0;else return err.textContent=`Informe o valor em R$ (ex.: 1.250,50).`}
    if(x<0||(x===0&&!f.opt&&!f.zero))return err.textContent='O valor precisa ser maior que zero.'}
   else if(f.type==='day'){x=parseInt(el.value,10);if(!(x>=1&&x<=31))return err.textContent='Informe o dia do vencimento, de 1 a 31.'}
   else{x=el.value.trim();if(f.type==='date'&&!x)x=today();if(!x&&!f.opt)return err.textContent=`Preencha: ${f.label.toLowerCase()}.`}
   v[f.id]=x;
  }
  if(c.validate){const m=c.validate(v);if(m)return err.textContent=m}
  c.onSave(v);save();closeSheet();render();
 };
 const first=form.querySelector('input,select');if(first&&matchMedia('(pointer:fine)').matches)first.focus();
}

/* cartões */
function diasVenc(d){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=(a,b)=>new Date(a,b+1,0).getDate();
 const t0=new Date(y,m,n.getDate());let t=new Date(y,m,Math.min(d,dim(y,m)));if(t<t0)t=new Date(y,m+1,Math.min(d,dim(y,m+1)));return Math.round((t-t0)/864e5)}
const fatura=c=>sum((c.compras||[]).map(x=>x.valor));
function cardTile(c,i,btn){
 const f=fatura(c),pct=c.limite>0?Math.min(100,f/c.limite*100):0,d=diasVenc(c.venc),g=GRAD[i%GRAD.length];
 const venc=f>0?(d===0?'vence hoje':d===1?'vence amanhã':`vence em ${d} dias`):'sem fatura';
 const inner=`<div class="c-top"><b>${esc(c.nome)}</b><span>Dia ${c.venc} · ${venc}</span></div><div><small>Fatura atual</small><strong class="num">${R(f)}</strong></div><div class="track"><i style="width:${pct}%"></i></div><div class="c-bot"><span class="num">Limite ${R(c.limite)}</span><span class="num">Livre ${R(c.limite-f)}</span></div>`;
 const st=`style="--g1:${g[0]};--g2:${g[1]}"`;
 return btn?`<button class="ccard" ${st} data-go="#cartao-${c.id}">${inner}</button>`:`<div class="ccard" ${st}>${inner}</div>`;
}

 openSheet({title:c?'Editar cartão':'Novo cartão',fields:[
  {id:'nome',label:'Nome do cartão',type:'text',value:c?c.nome:'',placeholder:'Ex.: Nubank, Itaú Platinum'},
  {id:'limite',label:'Limite',type:'money',value:c?c.limite:''},
  {id:'venc',label:'Dia do vencimento',type:'day',value:c?c.venc:''}],
  onSave:v=>{c?Object.assign(c,{nome:v.nome,limite:v.limite,venc:v.venc}):S.cartoes.push(mk({nome:v.nome,limite:v.limite,venc:v.venc,compras:[]}))},
  onDelete:c&&(()=>{S.cartoes=S.cartoes.filter(x=>x!==c);if(route().startsWith('cartao-'))location.hash='#cartoes'})});
}
function formCompra(cid,xid){
 const c=S.cartoes.find(x=>x.id===cid);if(!c)return;const x=c.compras.find(k=>k.id===xid);
 openSheet({title:x?'Editar compra':'Nova compra',fields:[
  {id:'desc',label:'O que foi comprado',type:'text',value:x?x.desc:'',placeholder:'Ex.: Farmácia, Mercado'},
  {id:'valor',label:'Valor',type:'money',value:x?x.valor:''},{id:'data',label:'Data',type:'date',value:x?x.data:today()}],
  onSave:v=>{x?Object.assign(x,{desc:v.desc,valor:v.valor,data:v.data}):c.compras.push(mk({desc:v.desc,valor:v.valor,data:v.data}))},
  onDelete:x&&(()=>{c.compras=c.compras.filter(k=>k!==x)})});
}
function pagarFatura(cid){
 const c=S.cartoes.find(x=>x.id===cid);if(!c)return;const f=fatura(c);
 openSheet({title:'Pagar fatura',text:`A fatura de ${R(f)} do ${c.nome} será lançada como uma saída de hoje e as compras serão zeradas.`,save:'Confirmar pagamento',fields:[],
  onSave:()=>{S.saidas.push(mk({catId:'',nome:'Fatura '+c.nome,valor:f,data:today()}));c.compras=[]}});
}

/* movimentações (reserva e filhos) */
function histRows(l,label){return l.length?`<div class="list">${[...l].sort(byDate).map(m=>row({ic:m.tipo==='add'?'plus':'minus',tone:m.tipo==='add'?'in':'out',t:m.nota||(m.tipo==='add'?'Adicionado':'Retirado'),s:fdate(m.data),v:(m.tipo==='add'?'+':'−')+R(m.valor),act:label,id:m.id})).join('')}</div>`:empty('Nenhuma movimentação','Use os botões acima para adicionar ou retirar valores.')}
function formMov(list,tipo,id,after){
 const m=id&&list.find(x=>x.id===id),tp=m?m.tipo:tipo;
 openSheet({title:m?'Editar movimentação':tp==='add'?'Adicionar valor':'Retirar valor',tone:tp==='add'?'in':'out',fields:[
  {id:'valor',label:'Valor',type:'money',value:m?m.valor:''},{id:'nota',label:'Observação (opcional)',type:'text',opt:1,value:m?m.nota:'',placeholder:'Ex.: Mesada de novembro'},{id:'data',label:'Data',type:'date',value:m?m.data:today()}],
  validate:v=>tp==='sub'&&v.valor>movTotal(list,id)?`Você só pode retirar até ${R(movTotal(list,id))}.`:'',
  onSave:v=>{m?Object.assign(m,{valor:v.valor,nota:v.nota,data:v.data}):list.push(mk({tipo:tp,valor:v.valor,nota:v.nota,data:v.data}))},
  onDelete:m&&(()=>{const i=list.indexOf(m);list.splice(i,1)})});
}
V.reservas=()=>{const t=movTotal(S.reserva);return `<div class="stack">${top('Reservas',{back:'mais'})}
 <section class="hero"><span class="lbl">Reserva de emergência</span><span class="big num">${R(t)}</span><p>Já reservado até hoje</p></section>
 <div class="btns"><button class="btn in" data-act="res-add">${ic('plus')} Adicionar</button><button class="btn out" data-act="res-sub">${ic('minus')} Retirar</button></div>
 <div class="sec"><span>Histórico</span></div>${histRows(S.reserva,'res-edit')}</div>`};

/* filhos */
V.filhos=()=>{const t=S.filhos.reduce((a,f)=>a+movTotal(f.movs),0);return `<div class="stack">${top('Dinheiro dos filhos',{back:'mais'})}
 <section class="hero"><span class="lbl">Total destinado aos filhos</span><span class="big num">${R(r2(t))}</span><p>${S.filhos.length} filho${S.filhos.length===1?'':'s'} cadastrado${S.filhos.length===1?'':'s'}</p></section>
 <button class="btn primary" data-act="add-filho">${ic('plus')} Cadastrar filho</button>
 ${S.filhos.length?S.filhos.map((f,i)=>`<div class="kid"><button class="main" data-go="#filho-${f.id}"><span class="avatar" style="background:${colorAt(i+1)}">${esc(f.nome.trim().charAt(0).toUpperCase())}</span><span><b>${esc(f.nome)}</b><strong class="num">${R(movTotal(f.movs))}</strong></span></button><button class="btn sm" style="width:auto" data-act="fil-add" data-id="${f.id}">${ic('plus')} Destinar</button></div>`).join(''):empty('Nenhum filho cadastrado','Cadastre o nome de cada filho e acompanhe quanto foi destinado a cada um.')}</div>`};
function filhoView(id){
 const i=S.filhos.findIndex(f=>f.id===id),f=S.filhos[i];
 if(!f)return `<div class="stack">${top('Filho',{back:'filhos'})}${empty('Não encontrado','Volte para a lista.')}</div>`;
 return `<div class="stack">${top(f.nome,{back:'filhos'})}
 <section class="hero"><span class="lbl">Destinado a ${esc(f.nome)}</span><span class="big num">${R(movTotal(f.movs))}</span><p>Dinheiro separado, fora do seu uso livre</p></section>
 <div class="btns"><button class="btn in" data-act="fil-add" data-id="${f.id}">${ic('plus')} Destinar</button><button class="btn out" data-act="fil-sub" data-id="${f.id}">${ic('minus')} Retirar</button></div>
 <button class="btn" data-act="edit-filho" data-id="${f.id}">Editar nome</button>
 <div class="sec"><span>Histórico</span></div>${histRows(f.movs,'fil-edit').replace(/data-id="/g,`data-id="${f.id}|`)}</div>`;
}
function formFilho(id){
 const f=S.filhos.find(x=>x.id===id);
 openSheet({title:f?'Editar filho':'Cadastrar filho',text:f?'Ao excluir, o valor destinado volta para o seu saldo livre.':'',fields:[{id:'nome',label:'Nome',type:'text',value:f?f.nome:'',placeholder:'Nome do filho(a)'}],
  onSave:v=>{f?f.nome=v.nome:S.filhos.push(mk({nome:v.nome,movs:[]}))},onDelete:f&&(()=>{S.filhos=S.filhos.filter(x=>x!==f);if(route().startsWith('filho-'))location.hash='#filhos'})});
}

/* objetivos */
V.objetivos=()=>{const t=sum(S.objetivos.map(o=>o.valor||0));return `<div class="stack">${top('Objetivos',{back:'mais'})}
 <section class="hero"><span class="lbl">Total planejado nos destinos</span><span class="big num">${R(t)}</span><p>${S.objetivos.length} destino${S.objetivos.length===1?'':'s'} para o seu dinheiro</p></section>
 <button class="btn primary" data-act="add-obj">${ic('plus')} Novo destino</button>
 ${S.objetivos.length?`<div class="list">${S.objetivos.map((o,i)=>`<button class="row" data-act="edit-obj" data-id="${o.id}"><span class="ico" style="background:${colorAt(i)};color:#fff">${ic('target')}</span><span class="rt"><b>${esc(o.nome)}</b><small>${o.valor>0?'Valor destinado':'Sem valor definido'}</small></span><span class="rv num">${o.valor>0?R(o.valor):'—'}</span></button>`).join('')}</div>`:empty('Nenhum destino','Crie destinos como alimentação, contas básicas, lazer…')}</div>`};
function formObj(id){
 const o=S.objetivos.find(x=>x.id===id);
 openSheet({title:o?'Editar destino':'Novo destino',fields:[{id:'nome',label:'Nome do destino',type:'text',value:o?o.nome:'',placeholder:'Ex.: Lazer, Viagem, Escola'},{id:'valor',label:'Valor destinado (opcional)',type:'money',opt:1,value:o&&o.valor>0?o.valor:''}],
  onSave:v=>{o?Object.assign(o,{nome:v.nome,valor:v.valor}):S.objetivos.push(mk({nome:v.nome,valor:v.valor}))},onDelete:o&&(()=>{S.objetivos=S.objetivos.filter(x=>x!==o)})});
}

V.mais=()=>`<div class="stack">${top('Mais áreas')}
 <button class="menu" data-go="#reservas"><span class="ico brand">${ic('shield')}</span><span><b>Reservas</b><small>Reserva de emergência: ${R(movTotal(S.reserva))}</small></span>${ic('chev')}</button>
 <button class="menu" data-go="#filhos"><span class="ico brand">${ic('kids')}</span><span><b>Dinheiro dos filhos</b><small>${S.filhos.length} cadastrado${S.filhos.length===1?'':'s'}</small></span>${ic('chev')}</button>
 <button class="menu" data-go="#objetivos"><span class="ico brand">${ic('target')}</span><span><b>Objetivos</b><small>${S.objetivos.length} destino${S.objetivos.length===1?'':'s'} para o dinheiro</small></span>${ic('chev')}</button>
 ${cfgOk()?`<button class="menu" data-act="sair"><span class="ico">${ic('back')}</span><span><b>${getCode()&&getCode()!=='local'?'Código da família: '+esc(getCode()):'Sem código'}</b><small>${getCode()&&getCode()!=='local'?'Toque para sair deste aparelho':'Toque para entrar com um código'}</small></span>${ic('chev')}</button>`:''}
 <p class="lbl" style="text-align:center;margin:10px 8px">${syncState==='ok'?'Seus dados são sincronizados entre todos os aparelhos que têm acesso a esta página.':syncState==='readonly'?'Você pode ver os dados, mas seu acesso não permite editar. Peça ao dono para liberar como Colaborador.':'Seus dados ficam guardados somente neste aparelho.'}${canSave?'':' <b class="neg">Não foi possível salvar neste navegador.</b>'}</p></div>`;

/* ---------- roteador ---------- */
const route=()=>(location.hash||'#inicio').slice(1);
const NAV=[['inicio','Início','home'],['entradas','Entradas','down'],['saidas','Saídas','up'],['cartoes','Cartões','card'],['mais','Mais','more']];
function render(){
 let r=route(),h;
 if(r.startsWith('cartao-'))h=cartaoView(r.slice(7));else if(r.startsWith('filho-'))h=filhoView(r.slice(6));else{if(!V[r])r='inicio';h=V[r]()}
 $('#app').innerHTML=h;
 const act=r.startsWith('cartao')?'cartoes':NAV.some(n=>n[0]===r)?r:'mais';
 $('#nav').innerHTML=NAV.map(n=>`<button data-go="#${n[0]}" class="${n[0]===act?'on':''}" ${n[0]===act?'aria-current="page"':''}>${ic(n[2])}<span>${n[1]}</span></button>`).join('');
}
let lastRoute=null;
function onHash(){closeSheet();render();if(lastRoute!==route())window.scrollTo(0,0);lastRoute=route()}
window.addEventListener('hashchange',onHash);

const A={
 'add-entrada':()=>formEntrada(),'edit-entrada':id=>formEntrada(id),
 'add-saida':()=>formSaida(),'edit-saida':id=>formSaida(id),'add-cat':()=>formCat(),'edit-cat':id=>formCat(id),
 'add-cartao':()=>formCartao(),'edit-cartao':id=>formCartao(id),'add-compra':id=>formCompra(id),
 'edit-compra':id=>{const p=id.split('|');formCompra(p[0],p[1])},'pagar':id=>pagarFatura(id),
 'res-add':()=>formMov(S.reserva,'add'),'res-sub':()=>formMov(S.reserva,'sub'),'res-edit':id=>formMov(S.reserva,null,id),
 'add-filho':()=>formFilho(),'edit-filho':id=>formFilho(id),
 'fil-add':id=>formMov(S.filhos.find(f=>f.id===id).movs,'add'),'fil-sub':id=>formMov(S.filhos.find(f=>f.id===id).movs,'sub'),
 'fil-edit':id=>{const p=id.split('|');formMov(S.filhos.find(f=>f.id===p[0]).movs,null,p[1])},
 'sair':()=>{
  if(getCode()==='local'||!getCode()){try{localStorage.removeItem(CODE_KEY)}catch(e){}location.reload();return}
  openSheet({title:'Sair deste aparelho',text:'Os dados continuam salvos na nuvem. Para voltar, basta digitar o mesmo código.',save:'Sair',fields:[],onSave:()=>{DB=null;synced=false;S=defaults();try{localStorage.removeItem(CODE_KEY)}catch(e){}setTimeout(()=>location.reload(),60)}})},
 'add-obj':()=>formObj(),'edit-obj':id=>formObj(id)
};
document.addEventListener('click',e=>{
 if(!$('#sheet').hidden)return;
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a.dataset.id)}
});
lastRoute=route();render();initSync();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
</body></html>
